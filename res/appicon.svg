    <circle cx="256" cy="256" r="235" fill="#3dff1f" opacity="0.10" filter="url(#blur12)"/>

    <!-- Schallplatte (vergrößert) -->
    <circle cx="256" cy="256" r="200" fill="url(#vinyl)" stroke="#3dff1f" stroke-width="3" filter="url(#neon)"/>

