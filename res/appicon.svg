<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Hintergrund -->
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#132a1b"/>
      <stop offset="55%" stop-color="#0b1510"/>
      <stop offset="100%" stop-color="#050a07"/>
    </radialGradient>

    <!-- Plattenoberfläche -->
    <radialGradient id="vinyl" cx="38%" cy="34%" r="80%">
      <stop offset="0%" stop-color="#1c2a20"/>
      <stop offset="55%" stop-color="#0e1712"/>
      <stop offset="100%" stop-color="#070c09"/>
    </radialGradient>

    <!-- Neon-Label -->
    <radialGradient id="label" cx="40%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#a8ff8f"/>
      <stop offset="45%" stop-color="#3dff1f"/>
      <stop offset="100%" stop-color="#17c50e"/>
    </radialGradient>

    <!-- Glanz -->
    <radialGradient id="sheen" cx="35%" cy="28%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon-Glow -->
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blur12" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <clipPath id="squircle">
      <rect width="512" height="512" rx="116" ry="116"/>
    </clipPath>
  </defs>

  <!-- Icon-Hintergrund -->
  <rect width="512" height="512" rx="116" ry="116" fill="url(#bg)"/>

  <g clip-path="url(#squircle)">
